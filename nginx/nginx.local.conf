# nginx.local.conf — plain HTTP for local testing on http://localhost/.
#
# The production config (nginx/nginx.conf) listens on 443 and reads a
# Let's Encrypt certificate for deltaconvert.com. That certificate does
# not exist on a laptop, so nginx would refuse to start. This file drops
# SSL, the redirect and HSTS, and keeps every other protection.
#
# compose.local.yml selects this file when you build locally (through
# dev.ps1). The server never sees it.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server_tokens off;

    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_header_timeout 15s;
    client_body_timeout 15s;

    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_conn_status 429;

    # No caching locally, so a rebuild is visible on the first reload. Set
    # through a map at server level; add_header inside a location would
    # discard the security headers below.
    map $uri $cache_control {
        ~*\.(?:css|js)$  "no-store";
        default          "";
    }

    # Compose publishes this server on 127.0.0.1 only, and there is no
    # redirect here, so any Host name may reach it.
    server {
        listen 80;
        server_name localhost;

        limit_conn conn_zone 100;

        # The same headers as production apart from HSTS, which would pin
        # localhost to HTTPS in the browser.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control $cache_control;

        # Docker's embedded DNS. Naming the backend through a variable
        # defers the lookup to request time; with a literal hostname nginx
        # resolves at startup and refuses to start when the backend
        # container is absent, which blocks frontend-only runs.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cortex_upstream http://cortex:8000;

        root /usr/share/nginx/html;
        index index.html;

        location ~ /\. {
            return 404;
        }

        location ~ ^/stochastix(/.*)?$ {
            return 301 /exchange.html#forecast;
        }

        # Called only from inside the backend container (see README-DEPLOYMENT.md).
        location ^~ /api/v1/audit/resolve {
            return 404;
        }

        # Forecasts can take a while on a cold model cache, so the read
        # timeout here is generous.
        location ^~ /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass $cortex_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        location = /health {
            limit_req zone=general_zone burst=50 nodelay;
            proxy_pass $cortex_upstream/health;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            limit_req zone=general_zone burst=50 nodelay;
            try_files $uri $uri/ =404;
        }
    }
}
