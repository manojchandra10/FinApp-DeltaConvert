# nginx.conf — reverse proxy + static multi-page site.
# Domain: deltaconvert.com.
# The converter routes are gone. The old React app lived at /stochastix/;
# those links now issue a permanent redirect to the Forecast page.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # No version number in the Server header or on error pages.
    server_tokens off;

    # Request limits. API bodies are a few hundred bytes, and a client that
    # takes longer than 15 seconds to send its headers or body is dropped.
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_header_timeout 15s;
    client_body_timeout 15s;

    # Rate limiting keyed on the connecting address
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_conn_status 429;

    # Scripts and styles are revalidated on each load: they carry an ETag,
    # so unchanged files answer with a cheap 304, and a redeploy shows up
    # on the next reload rather than an hour later. The value is set at
    # server level through this map, because add_header inside a location
    # discards every header inherited from the server block.
    map $uri $cache_control {
        ~*\.(?:css|js)$  "no-cache";
        default          "";
    }

    # Unknown host names over plain HTTP: the connection is closed without
    # a response, so no redirect is built from an arbitrary Host header.
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # Unknown host names over TLS: the handshake is refused, so the site's
    # certificate and content are only ever served for its own names. A
    # request that names the site in the handshake but another host in its
    # Host header also lands here, and its connection is closed.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    # Redirect all plain HTTP to HTTPS (except the ACME challenge). Only the
    # two names below reach this block, so $host is always one of them.
    server {
        listen 80;
        server_name deltaconvert.com www.deltaconvert.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name deltaconvert.com www.deltaconvert.com;

        ssl_certificate     /etc/letsencrypt/live/deltaconvert.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deltaconvert.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Mozilla "intermediate" cipher list without the DHE suites: ECDHE
        # key exchange with AES-GCM or ChaCha20 only, no CBC-mode suites.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        # Tickets are encrypted with a key nginx never rotates while it
        # runs; the shared session cache above resumes sessions instead.
        ssl_session_tickets off;

        limit_conn conn_zone 100;

        # Security headers. All of them sit here at server level and no
        # location uses add_header, so every response carries them: pages,
        # scripts, styles and API answers alike.
        #
        # The Content-Security-Policy matches the site as built: scripts,
        # styles and API calls from this origin only; no plugins, frames or
        # third-party content. Style attributes are permitted because the
        # pages and app.js use inline style attributes for layout values;
        # style elements are still limited to this origin.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control $cache_control;

        # Docker's embedded DNS. Naming the backend through a variable
        # defers the lookup to request time; with a literal hostname nginx
        # resolves at startup and refuses to start when the backend
        # container is absent, which blocks frontend-only runs.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cortex_upstream http://cortex:8000;

        root /usr/share/nginx/html;
        index index.html;

        # Dotfiles are never served.
        location ~ /\. {
            return 404;
        }

        # Old app path — permanent redirect to the Forecast page
        location ~ ^/stochastix(/.*)?$ {
            return 301 /exchange.html#forecast;
        }

        # The audit-resolve endpoint is called only by the daily cron job,
        # from inside the backend container. It is not reachable from the
        # internet. The backend also refuses callers outside loopback.
        location ^~ /api/v1/audit/resolve {
            return 404;
        }

        # API proxy to the FastAPI container. ^~ stops the regex locations
        # above from capturing /api/ paths.
        # X-Real-IP carries the true client address; the backend rate
        # limiter reads this header rather than X-Forwarded-For, which
        # a client can spoof, and only when the request comes from nginx.
        location ^~ /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass $cortex_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Health check passthrough
        location = /health {
            limit_req zone=general_zone burst=50 nodelay;
            proxy_pass $cortex_upstream/health;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static multi-page site
        location / {
            limit_req zone=general_zone burst=50 nodelay;
            try_files $uri $uri/ =404;
        }
    }
}
