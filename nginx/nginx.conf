# nginx.conf — reverse proxy + static multi-page site.
# Domain: deltaconvert.com.
# The converter routes are gone. The old React app lived at /stochastix/;
# those links now issue a permanent redirect to the Forecast page.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting keyed on the connecting address
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=30r/s;

    # Redirect all plain HTTP to HTTPS (except the ACME challenge)
    server {
        listen 80;
        server_name deltaconvert.com www.deltaconvert.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name deltaconvert.com www.deltaconvert.com;

        ssl_certificate     /etc/letsencrypt/live/deltaconvert.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deltaconvert.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Docker's embedded DNS. Naming the backend through a variable
        # defers the lookup to request time; with a literal hostname nginx
        # resolves at startup and refuses to start when the backend
        # container is absent, which blocks frontend-only runs.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cortex_upstream http://cortex:8000;

        root /usr/share/nginx/html;
        index index.html;

        # Old app path — permanent redirect to the Forecast page
        location ~ ^/stochastix(/.*)?$ {
            return 301 /exchange.html#forecast;
        }

        # API proxy to the FastAPI container.
        # X-Real-IP carries the true client address; the backend rate
        # limiter reads this header rather than X-Forwarded-For, which
        # a client can spoof.
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass $cortex_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Health check passthrough
        location = /health {
            proxy_pass $cortex_upstream/health;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static multi-page site
        location / {
            limit_req zone=general_zone burst=50 nodelay;
            try_files $uri $uri/ =404;
        }

        # Short cache on the shared bundle; new deploys propagate quickly
        # Revalidate scripts and styles on each load: they carry an ETag,
        # so unchanged files answer with a cheap 304, and a redeploy shows
        # up on the next reload rather than an hour later.
        location ~* \.(css|js)$ {
            add_header Cache-Control "no-cache";
        }
    }
}