# Currency rates and forecast stack.
# The Flask file-converter service and its dc_temp volume have been removed.
#
# The project name is pinned to "deltaconvert" below. That matches the
# default the old stack used (taken from the folder name), so the existing
# volumes (deltaconvert_postgres_data, deltaconvert_certbot_certs) keep
# working with no data migration.
#
# .env is required. Compose refuses to start without POSTGRES_PASSWORD,
# so no deployment can fall back to a password printed in this repository.
# On a laptop, dev.ps1 writes a .env with random local secrets. On a
# server, write it by hand (see .env.example and README-DEPLOYMENT.md):
#
#   POSTGRES_USER=...
#   POSTGRES_PASSWORD=...        required
#   POSTGRES_DB=...
#   ADMIN_SECRET=...             32+ random characters, or the audit stays locked
#   DOMAIN=deltaconvert.com
#
# Each container receives only the variables it needs, listed under its
# environment key; .env is not passed in whole.

name: deltaconvert

# Docker's json-file driver never rotates on its own. Request logs would
# grow until the disk filled (stopping Postgres with everything else) and
# would keep visitor addresses indefinitely. 5 files of 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # === REVERSE PROXY (serves the static site and proxies /api) ===
  # The image reloads nginx every 6 hours so renewed certificates take
  # effect (nginx/reload-certs.sh; NGINX_RELOAD_INTERVAL overrides it).
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: dc_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      cortex:
        condition: service_healthy
    volumes:
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # === CORTEX (FastAPI rates + forecast backend) ===
  cortex:
    build: ./stochastix/cortex
    container_name: dc_cortex
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-deltaconvert}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-deltaconvert}
      - ENVIRONMENT=production
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - APP_BRAND=${APP_BRAND:-DeltaConvert}
      - CORS_ORIGINS=https://${DOMAIN:-deltaconvert.com},https://www.${DOMAIN:-deltaconvert.com}
      # Empty means all 29 currencies; see compose.local.yml for a short list.
      - CURRENCIES=${CURRENCIES:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    # The API runs as an unprivileged user (see its Dockerfile) and needs
    # no Linux capabilities at all.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # === POSTGRESQL (prediction audit database) ===
  db:
    image: postgres:15-alpine
    container_name: dc_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-deltaconvert}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      - POSTGRES_DB=${POSTGRES_DB:-deltaconvert}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deltaconvert} -d ${POSTGRES_DB:-deltaconvert}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # === CERTBOT (SSL certificate renewal) ===
  # Pinned: an untagged image could bring a different release on every pull.
  certbot:
    image: certbot/certbot:v5.8.0
    container_name: dc_certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --quiet; done'"
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # DB is unreachable from outside

volumes:
  postgres_data:
  certbot_webroot:
  certbot_certs:
